services:
  canopus-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: canopus
        uid: 1000
    image: canopus-app
    container_name: canopus-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - canopus-network
    depends_on:
      - canopus-redis

  canopus-db:
    image: mysql:8.0
    container_name: canopus-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: canopus_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: canopus
    volumes:
      - ./.docker/mysql/dbdata:/var/lib/mysql
    networks:
      - canopus-network
    ports:
      - "3306:3306"

  canopus-nginx:
    image: nginx:alpine
    container_name: canopus-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - canopus-network

  canopus-redis:
    image: redis:alpine
    container_name: canopus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/redis/data:/data
    networks:
      - canopus-network

networks:
  canopus-network:
    driver: bridge
